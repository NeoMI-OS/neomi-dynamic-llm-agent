options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/neomi-pipeline-ui:$COMMIT_SHA', '.']
    dir: 'frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/neomi-pipeline-ui:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'neomi-pipeline-ui'
      - '--image=gcr.io/$PROJECT_ID/neomi-pipeline-ui:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/neomi-pipeline-ui:$COMMIT_SHA'
