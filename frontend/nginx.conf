server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self' https://dynamic-llm-agent-dev-643234238822.europe-west1.run.app https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
