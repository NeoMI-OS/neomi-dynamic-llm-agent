# exp_003_mixed_optimal.yaml
# Vegyes optimális konfiguráció: minden szerephez a legalkalmasabb modell
experiment:
  id: "exp-003"
  name: "Mixed Optimal - Szerepre optimalizált modellek"
  description: "Minden node-hoz a legjobb modell: gyors elemzőknek olcsó modell, kritikusnak erős modell"
  version: "1.0"

nodes:
  context_analyst:
    model: "gemini-2.5-flash-lite"
    provider: "google"
    temperature: 0.3
  needs_analyzer:
    model: "gpt-4o-mini"
    provider: "openai"
    temperature: 0.2
  curriculum_designer:
    model: "gpt-4o"
    provider: "openai"
    temperature: 0.5
  content_writer:
    model: "gpt-4o"
    provider: "openai"
    temperature: 0.7
  critic:
    model: "claude-sonnet-4-6"
    provider: "anthropic"
    temperature: 0.1

settings:
  language: "hungarian"
  max_tokens_per_node: 1000
